version: '3.8'

services:
  redis-carts:
    image: redis:8.8-alpine
    container_name: bakery-carts-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_carts_data:/data
    networks:
      - dokploy-network

  redis-gateway:
    image: redis:8.8-alpine
    container_name: bakery-gateway-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_gateway_data:/data
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  redis_carts_data:
  redis_gateway_data:
