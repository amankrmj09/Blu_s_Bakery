version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: bakery-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: product_user
      MONGO_INITDB_ROOT_PASSWORD: product_password
    volumes:
      - mongo_data:/data/db
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  mongo_data:
